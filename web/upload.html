<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>上传图片 | Image Host</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="workspace-page">
  <header class="topbar">
    <a class="wordmark" href="/upload" aria-label="Image Host 上传首页">
      <span class="wordmark-symbol" aria-hidden="true"></span>
      <span>Image Host</span>
    </a>
    <div class="topbar-actions">
      <span class="secure-state"><span aria-hidden="true"></span>安全会话</span>
      <button class="quiet-button" id="logout-button" type="button">退出</button>
    </div>
  </header>

  <main class="workspace">
    <section class="workspace-heading">
      <div>
        <p class="section-label">NEW FILE</p>
        <h1>上传文件</h1>
      </div>
      <p>最多 9 个文件；图片 10 MiB，音频 50 MiB，视频 200 MiB</p>
    </section>

    <section class="upload-stage" aria-labelledby="drop-title">
      <input id="file-input" type="file" multiple accept="image/jpeg,image/png,image/gif,image/webp,audio/mpeg,audio/wav,audio/ogg,audio/mp4,video/mp4,video/webm,video/quicktime,application/pdf,application/epub+zip,text/plain,text/markdown,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.presentationml.presentation,.md,.epub,.docx,.xlsx,.pptx,.mp3,.wav,.ogg,.m4a,.mp4,.webm,.mov" hidden>
      <button class="drop-zone" id="drop-zone" type="button">
        <span class="upload-symbol" aria-hidden="true">↑</span>
        <span class="drop-title" id="drop-title">拖放文件到这里</span>
        <span class="drop-subtitle">或点击选择文件</span>
        <span class="format-line compact" aria-hidden="true">
          <span>JPEG</span><span>PNG</span><span>GIF</span><span>WEBP</span><span>MP3</span><span>WAV</span><span>MP4</span><span>WEBM</span><span>PDF</span><span>DOCX</span>
        </span>
      </button>

      <div class="selection" id="selection" hidden>
        <div class="preview-frame file-list" id="file-list"></div>
        <div class="file-details">
          <p class="file-name" id="file-name">已选择 0 个文件</p>
          <p class="file-meta" id="file-meta"></p>
          <div class="selection-actions">
            <button class="primary-button" id="upload-button" type="button">开始上传</button>
            <button class="quiet-button" id="replace-button" type="button">重新选择</button>
          </div>
        </div>
      </div>

      <div class="upload-progress" id="upload-progress" hidden aria-live="polite">
        <div class="progress-copy"><span>正在安全上传</span><span id="progress-value">0%</span></div>
        <div class="progress-track"><span id="progress-bar"></span></div>
      </div>

      <div class="result" id="result" hidden aria-live="polite">
        <div class="result-status"><span aria-hidden="true">✓</span><strong id="result-title">上传结果</strong></div>
        <div class="result-list" id="result-list"></div>
        <button class="quiet-button" id="upload-another" type="button">继续上传</button>
      </div>

      <p class="form-message upload-error" id="upload-message" role="alert"></p>
    </section>
  </main>

  <footer class="workspace-footer">
    <span>本地持久化存储</span><span>公开链接无需登录</span>
  </footer>
  <script src="/assets/upload.js" defer></script>
</body>
</html>
